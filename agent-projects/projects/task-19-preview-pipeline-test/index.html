<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Preview Pipeline Works</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#06b6d4;--text:#e6eef6}
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial}
    body{background:linear-gradient(180deg,#071024 0%,#071a2a 100%);color:var(--text);display:flex;align-items:center;justify-content:center}
    .card{background:rgba(255,255,255,0.03);padding:36px 44px;border-radius:12px;box-shadow:0 8px 30px rgba(2,6,23,0.6);text-align:center;max-width:520px}
    h1{margin:0 0 16px;font-size:28px;letter-spacing:0.2px}
    p{margin:0 0 22px;color:rgba(230,238,246,0.85)}
    .btn{display:inline-block;padding:12px 20px;border-radius:8px;background:linear-gradient(90deg,var(--accent),#3b82f6);color:#022; font-weight:700;text-decoration:none;border:none;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease}
    .btn:hover{transform:translateY(-3px);box-shadow:0 10px 25px rgba(6,182,212,0.14)}
  </style>
</head>
<body>
  <div class="card" role="main">
    <h1>Preview Pipeline Works</h1>
    <p>This is a simple preview page created for the "Preview Pipeline Test" task. Use the button below to open the website (placeholder).</p>
    <a class="btn" href="#" onclick="window.open('https://example.com','_blank')">Open Website</a>
  </div>
</body>
</html>
