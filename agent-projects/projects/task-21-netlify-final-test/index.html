<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>XPAND Live Preview Works</title>
  <style>
    /* XPAND Agent — single-file responsive dark page */
    :root{
      --bg:#0b0f14; --card:#0f1720; --text:#e6eef8; --muted:#9fb0c8; --accent:#2dd4bf;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      min-height:100vh;
      background:radial-gradient(circle at 10% 10%,#071022 0%,var(--bg) 40%);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    .container{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem}
    .card{
      max-width:720px;width:100%;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);
      border:1px solid rgba(255,255,255,0.04);padding:2.5rem;border-radius:12px;
      box-shadow:0 10px 30px rgba(2,6,23,0.7);text-align:center
    }
    h1{margin:0 0 0.5rem;font-size:clamp(1.4rem,4vw,2.2rem);letter-spacing:0.2px}
    p{margin:0 0 1.5rem;color:var(--muted);font-size:1rem}
    button{
      background:linear-gradient(90deg,var(--accent),#06b6d4);border:none;padding:0.8rem 1.2rem;color:#062024;
      border-radius:9px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(45,212,191,0.12);
      transition:transform .15s ease,box-shadow .15s ease
    }
    button:active{transform:translateY(1px)}
    .footer-note{margin-top:1rem;font-size:0.85rem;color:var(--muted)}
    @media (max-width:420px){.card{padding:1.5rem;border-radius:10px}p{font-size:0.95rem}}
  </style>
</head>
<body>
  <!-- Created by XPAND Agent on 2026-08-26 for task 21 (do not publish without Kareem's approval) -->
  <div class="container">
    <main class="card" role="main" aria-labelledby="main-title">
      <h1 id="main-title">XPAND Live Preview Works</h1>
      <p>Published automatically by XPAND Agent</p>
      <button id="testBtn" type="button" aria-pressed="false">Test Successful</button>
      <div class="footer-note" aria-hidden="true">Saved to repository on 2026-08-26</div>
    </main>
  </div>
</body>
</html>
