<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview Pipeline Works</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#06b6d4;--text:#e6eef8}
    html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;color:var(--text);background:linear-gradient(135deg,#071026 0%,#071022 40%, #041123 100%)}
    .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.04);padding:32px;border-radius:12px;box-shadow:0 8px 30px rgba(2,6,23,0.6);max-width:520px;width:100%;text-align:center}
    h1{margin:0 0 18px 0;font-size:28px;letter-spacing:0.2px}
    p{margin:0 0 22px 0;color:rgba(230,238,248,0.85)}
    .btn{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(90deg,var(--accent),#7dd3fc);color:#042023;padding:12px 18px;border-radius:10px;border:0;cursor:pointer;font-weight:600;text-decoration:none}
    .btn:active{transform:translateY(1px)}
    .meta{margin-top:16px;font-size:13px;color:rgba(230,238,248,0.65)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Preview Pipeline Works</h1>
      <p>This is a minimal preview page created for the "Preview Pipeline Test 2" project.</p>
      <a class="btn" href="https://example.com" target="_blank" rel="noopener noreferrer">Open Website</a>
      <div class="meta">Single-file HTML/CSS — open the button to visit the example site.</div>
    </div>
  </div>
</body>
</html>
