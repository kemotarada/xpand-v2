<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kemo Agent Works</title>
  <style>
    :root{
      --bg:#0b0f12;
      --card:#0f1518;
      --muted:#9aa5ad;
      --accent:#6be3c4;
      --accent-2:#4dd0ff;
      --glass: rgba(255,255,255,0.03);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(77,208,255,0.04), transparent),
                  radial-gradient(1000px 500px at 90% 90%, rgba(107,227,196,0.03), transparent),
                  var(--bg);
      color:#e6eef2;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px;
    }
    .card{
      width:100%;
      max-width:920px;
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.04);
      border-radius:14px;
      padding:48px;
      box-shadow: 0 10px 30px rgba(2,6,8,0.7);
      backdrop-filter: blur(6px);
    }
    header{
      display:flex;
      align-items:center;
      gap:20px;
      margin-bottom:20px;
    }
    .logo{
      width:64px;height:64px;border-radius:10px;
      background: linear-gradient(135deg,var(--accent),var(--accent-2));
      display:flex;align-items:center;justify-content:center;font-weight:700;color:#032022;font-size:18px;
      box-shadow: 0 4px 18px rgba(75,190,170,0.12), inset 0 -6px 18px rgba(255,255,255,0.04);
    }
    h1{
      margin:0;font-size:clamp(28px,5vw,46px);line-height:1.02;
      letter-spacing:-0.02em;
    }
    p.lead{
      margin:18px 0 28px;color:var(--muted);font-size:clamp(14px,2.2vw,18px);
    }
    .actions{display:flex;gap:12px;flex-wrap:wrap}
    .btn{
      appearance:none;border:0;padding:12px 18px;border-radius:10px;font-weight:600;cursor:pointer;
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      color:var(--accent-2);border:1px solid rgba(77,208,255,0.12);
      transition:transform .14s ease, box-shadow .14s ease;
    }
    .btn.primary{
      background: linear-gradient(90deg,var(--accent),var(--accent-2));
      color:#042927;border:0;box-shadow: 0 8px 24px rgba(75,190,170,0.14);
    }
    .btn:active{transform:translateY(1px)}
    .btn:focus{outline:2px solid rgba(107,227,196,0.12)}
    footer{margin-top:26px;color:var(--muted);font-size:13px}
    @media (max-width:520px){
      .card{padding:28px}
      header{gap:12px}
      .logo{width:52px;height:52px;font-size:16px}
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <header>
      <div class="logo" aria-hidden>KA</div>
      <div>
        <h1>Kemo Agent Works</h1>
        <p class="lead">Autonomous project execution successful</p>
      </div>
    </header>

    <div class="actions">
      <button class="btn primary" id="testBtn">Test Successful</button>
      <button class="btn" id="copyBtn">Copy status</button>
    </div>

    <footer>
      <small>Dark responsive demo — created for Task 18.</small>
    </footer>
  </main>

  <script>
    document.getElementById('testBtn').addEventListener('click',function(){
      alert('Test Successful');
    });
    document.getElementById('copyBtn').addEventListener('click',async function(){
      const text = 'Kemo Agent Works — Autonomous project execution successful';
      try{ await navigator.clipboard.writeText(text); alert('Status copied'); }
      catch(e){ alert('Copy failed — '+(e && e.message ? e.message : '')) }
    });
  </script>
</body>
</html>
