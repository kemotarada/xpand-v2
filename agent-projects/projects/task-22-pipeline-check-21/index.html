<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pipeline Working</title>
  <style>
    :root{--bg:#f6f9fc;--card:#ffffff;--accent:#28a745;--text:#1f2d3d}
    html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{background:var(--card);padding:36px;border-radius:12px;box-shadow:0 6px 24px rgba(31,45,61,0.08);text-align:center;max-width:480px;width:100%}
    h1{margin:0 0 14px;font-size:28px;letter-spacing:-0.2px}
    p{margin:0 0 22px;color:#425566}
    .btn{display:inline-block;background:var(--accent);color:#fff;padding:12px 20px;border-radius:8px;border:none;font-weight:600;cursor:pointer;text-decoration:none;font-size:16px}
    .btn:active{transform:translateY(1px)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Pipeline Working</h1>
      <p>Current status: ready for manual verification.</p>
      <button class="btn" onclick="handleSuccess()">Success</button>
    </div>
  </div>

  <script>
    function handleSuccess(){
      // lightweight client-side confirmation only – no external calls
      alert('Success button clicked');
    }
  </script>
</body>
</html>
