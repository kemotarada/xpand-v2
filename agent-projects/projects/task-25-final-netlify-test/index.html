<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kemo Live Website</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#10b981;--text:#e6eef8}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:linear-gradient(135deg,#07102a 0%,#081427 100%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;display:flex;align-items:center;justify-content:center}
    .card{background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(255,255,255,0.01));padding:36px;border-radius:12px;box-shadow:0 6px 24px rgba(2,6,23,0.6);max-width:520px;width:90%;text-align:center}
    h1{margin:0 0 18px;font-size:28px;letter-spacing:0.2px}
    p{margin:0 0 22px;color:rgba(230,238,248,0.8)}
    .btn{background:var(--accent);color:#032018;padding:12px 20px;border-radius:10px;border:none;font-weight:600;cursor:pointer;font-size:16px;transition:transform .12s ease,box-shadow .12s ease}
    .btn:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(16,185,129,0.15)}
    .footer{margin-top:16px;font-size:12px;color:rgba(230,238,248,0.6)}
    @media (max-width:420px){h1{font-size:22px}.card{padding:24px}}
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>Kemo Live Website</h1>
    <p>Simple test page created for Final Netlify Test — includes a Success button.</p>
    <button class="btn" type="button">Success</button>
    <div class="footer">File: projects/task-25-final-netlify-test/index.html</div>
  </main>
</body>
</html>
