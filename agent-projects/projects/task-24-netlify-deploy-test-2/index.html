<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kemo Netlify Works</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#06b6d4;--text:#e6eef7}
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      background:linear-gradient(180deg,var(--bg),#071022);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .card{
      width:min(760px,100%);
      background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.04);
      border-radius:12px;
      padding:48px 32px;
      text-align:center;
      box-shadow:0 6px 30px rgba(2,6,23,0.6);
    }
    h1{margin:0 0 18px;font-size:clamp(20px,4vw,36px);letter-spacing:0.02em}
    p{margin:0 0 28px;color:rgba(230,238,247,0.8)}
    .btn{
      display:inline-flex;align-items:center;gap:10px;padding:12px 20px;background:var(--accent);color:#042026;border:none;border-radius:10px;font-weight:600;font-size:16px;cursor:pointer;box-shadow:0 6px 18px rgba(6,182,212,0.18);transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;text-decoration:none;
    }
    .btn:active{transform:translateY(1px)}
    .btn:focus{outline:3px solid rgba(6,182,212,0.18);outline-offset:3px}
    /* responsive spacing */
    @media (max-width:420px){.card{padding:28px 18px}}
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>Kemo Netlify Works</h1>
    <p>Single responsive page for Netlify deploy test. Click the button to confirm visual appearance.</p>
    <button class="btn" onclick="onSuccess()">Success</button>
  </main>

  <script>
    function onSuccess(){
      // lightweight visual confirmation; no network calls.
      const btn = document.querySelector('.btn');
      btn.disabled = true;
      btn.style.opacity = '0.9';
      btn.textContent = 'Success ✓';
      setTimeout(()=>btn.disabled=false,800);
    }
  </script>
</body>
</html>
